[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hibermem"
version = "0.1.0"
description = "Causal interaction structure for external LLM memory"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "HiberMem contributors" }]
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
reference = ["shapiq>=1.3,<2"]
llm = ["torch>=2.5", "transformers>=4.48,<6", "accelerate>=1.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config -p no:cacheprovider"
pythonpath = ["src"]
testpaths = ["tests"]
